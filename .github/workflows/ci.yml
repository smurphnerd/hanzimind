name: CI

on:
  push:
    branches: [main, hygiene]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-junit
          path: test-results/vitest/junit.xml

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_SHA: ${{ github.sha }}
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      S3_OPTIONS: '{"endpoint":"http://localhost:9090","region":"us-east-1","bucketName":"ci","forcePathStyle":true}'
      EMAIL_CONNECTION_URL: smtp://localhost:1025
      AUTH_SECRET: ci
      SYSTEM_EMAIL_FROM: ci@example.com
      DEEPL_API_KEY: ci
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm build

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The e2e job already migrates, through the lane it boots, but it takes
    # fifteen minutes to say so and reports a browser failure when the real
    # fault is a table. This job answers the same question in under a minute,
    # and it is the only place the adoption path an existing database takes is
    # exercised at all.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: An empty database gets every migration
        run: |
          out=$(pnpm exec tsx src/server/database/migrate.ts)
          echo "$out"
          grep -q 'Applied 1 migration' <<<"$out"

      - name: A second run applies nothing
        run: |
          out=$(pnpm exec tsx src/server/database/migrate.ts)
          echo "$out"
          grep -q 'applied 0 migrations' <<<"$out"

      - name: Adopting a database that is already migrated does nothing
        run: |
          out=$(pnpm exec tsx src/server/database/migrate.ts --baseline)
          echo "$out"
          grep -q 'Nothing to adopt' <<<"$out"

      - name: A database built the old way adopts the baseline and stays put
        env:
          PUSHED_URL: postgres://postgres:postgres@localhost:5432/pushed
        run: |
          psql "$DATABASE_URL" -c 'create database pushed'
          DATABASE_URL="$PUSHED_URL" pnpm exec drizzle-kit push --force
          out=$(DATABASE_URL="$PUSHED_URL" pnpm exec tsx src/server/database/migrate.ts --baseline)
          echo "$out"
          grep -q 'Recorded 0000_baseline' <<<"$out"
          out=$(DATABASE_URL="$PUSHED_URL" pnpm exec tsx src/server/database/migrate.ts)
          echo "$out"
          grep -q 'applied 0 migrations' <<<"$out"

      # The step above proves the adoption mechanics — the journal row is what
      # makes the migrate a no-op. It says nothing about whether the two
      # databases actually agree, which is the question the cutover rests on.
      # This is `docs/remote-setup.md` 5a's drift check, run between a
      # push-built database and a migrated one on every commit, so "generate
      # and push produce the same schema" is a fact CI keeps rather than a
      # claim this PR made once.
      - name: The migration and the old push build the same schema
        env:
          PUSHED_URL: postgres://postgres:postgres@localhost:5432/pushed
        run: |
          psql -X "$DATABASE_URL" -f scripts/schema-catalog.sql > migrated.txt
          psql -X "$PUSHED_URL" -f scripts/schema-catalog.sql > pushed.txt
          diff -u pushed.txt migrated.txt

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1"
      E2E_AUDIO: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Make Google TTS unreachable
        run: echo "127.0.0.1 translate.google.com" | sudo tee -a /etc/hosts
      - name: Run the suite on lane 0
        run: pnpm test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results/playwright
            !test-results/playwright/learner-state.json
            development/lanes
            !development/lanes/*/.env.lane
      - name: Tear the lane down
        if: always()
        run: .claude/skills/verify-hanzimind/scripts/lane-down.sh 0
