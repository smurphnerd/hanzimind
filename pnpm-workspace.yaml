# pnpm blocks dependency build (postinstall) scripts by default as a
# supply-chain precaution and asks you to opt in per package. Leaving the
# placeholder text in place makes `pnpm install` fail, which takes every
# `pnpm <script>` down with it.
#
# These are all false because nothing in the project has needed them: dev,
# typecheck, vitest and the ONNX runtime behind the semantic answer checker
# all work from the prebuilt binaries these packages ship. Flip an entry to
# true if a package turns out to need its native build step on your platform.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  bufferutil: false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false

overrides:
  "google-tts-api>axios": "^1.20.0"
  "onnxruntime-node>adm-zip": ">=0.6.0"
  "@huggingface/transformers>sharp": ">=0.35.0"
